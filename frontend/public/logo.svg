<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 42" width="160" height="42">
  <defs>
    <!-- Premium Radiant Gradient -->
    <linearGradient id="nexcart-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Futuristic Shopping Cart / Arrow Icon -->
  <g transform="translate(4, 5)">
    <!-- Sleek Rounded Background Shield -->
    <rect x="0" y="0" width="32" height="32" rx="10" fill="url(#nexcart-gradient)" opacity="0.12"/>
    
    <!-- Outer Cart Frame -->
    <path d="M7 9h4.5l3.5 13h10" stroke="url(#nexcart-gradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Wheels -->
    <circle cx="15.5" cy="23.5" r="2.5" fill="url(#nexcart-gradient)"/>
    <circle cx="21.5" cy="23.5" r="2.5" fill="url(#nexcart-gradient)"/>
    
    <!-- Inside N Shape -->
    <path d="M11 12h12l-2.5 7.5h-8z" stroke="url(#nexcart-gradient)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    <path d="M14 13v5M19 13v5" stroke="url(#nexcart-gradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <text x="46" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="800" fill="#1e293b" letter-spacing="-0.5">
    Nex<tspan fill="url(#nexcart-gradient)" font-weight="500">Cart</tspan>
  </text>
</svg>
